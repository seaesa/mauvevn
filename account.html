<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mauve - Tài khoản</title>
  <link rel="icon" type="image/png" href="https://theme.hstatic.net/200000408461/1001266442/14/favicon.png?v=891">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/pages.css">
</head>
<body class="page-inner page-account">

<main>
  <div class="account">
    <h1>Tài khoản</h1>
    <div class="account__tabs">
      <button type="button" class="is-active" data-account-tab="login">Đăng nhập</button>
      <button type="button" data-account-tab="register">Đăng ký</button>
    </div>
    <div class="account__panel is-active" data-account-panel="login">
      <form data-demo-form class="js-account-form">
        <div class="field"><input type="email" id="acc-email" placeholder=" " required><label for="acc-email">email</label></div>
        <div class="field"><input type="password" id="acc-pass" placeholder=" " required><label for="acc-pass">password/mật khẩu</label></div>
        <button type="submit" class="btn-login">Log in / Đăng nhập</button>
      </form>
    </div>
    <div class="account__panel" data-account-panel="register">
      <form data-demo-form class="js-account-form">
        <div class="field"><input type="text" id="reg-last" placeholder=" " required><label for="reg-last">Họ của bạn</label></div>
        <div class="field"><input type="text" id="reg-first" placeholder=" " required><label for="reg-first">Tên của bạn</label></div>
        <div class="field"><input type="text" id="reg-dob" placeholder=" "><label for="reg-dob">Ngày sinh</label></div>
        <div class="field"><input type="tel" id="reg-phone" placeholder=" " required><label for="reg-phone">Số điện thoại</label></div>
        <div class="field"><input type="email" id="reg-email" placeholder=" " required><label for="reg-email">Email</label></div>
        <div class="field"><input type="password" id="reg-pass" placeholder=" " required><label for="reg-pass">New password / mật khẩu mới</label></div>
        <label class="account__check"><input type="checkbox"> <span>Subscribe to Mauve new letter and be the first to know about newest arrivals, store event &amp; promotion</span></label>
        <button type="submit" class="btn-login">Sign up / Đăng ký</button>
      </form>
    </div>
    <p class="account__msg" hidden>Đây là bản demo — không có tài khoản thật, dữ liệu không được gửi đi.</p>
  </div>
</main>

<script src="/js/store.js"></script>
<script src="/js/layout.js"></script>
<script src="/js/main.js"></script>
<script src="/js/pages/account.js"></script>
</body>
</html>
