<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mauve – Trang chủ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="https://theme.hstatic.net/200000408461/1001266442/14/favicon.png?v=891">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="page-home">

<main>
  <h1 class="visually-hidden">Mauve</h1>

  <!-- Hero slider -->
  <section class="hero" id="hero">
    <div class="hero__track">
      <div class="hero__slide is-active">
        <a href="/collection/?handle=hidden-glow" aria-label="Banner 1"><img src="https://theme.hstatic.net/200000408461/1001266442/14/slideShow_f1_1.png?v=891" alt="slider-website-1"></a>
      </div>
      <div class="hero__slide">
        <a href="/collection/?handle=mong-doi-thuong" aria-label="Banner 2"><img src="https://theme.hstatic.net/200000408461/1001266442/14/slideShow_f1_2.png?v=891" alt="slider-website-2" loading="lazy"></a>
      </div>
      <div class="hero__slide">
        <a href="/product/?handle=signature-dress" aria-label="Banner 3"><img src="https://theme.hstatic.net/200000408461/1001266442/14/slideShow_f1_3.png?v=891" alt="slider-website-3" loading="lazy"></a>
      </div>
    </div>
    <ul class="dots-vertical" role="tablist"></ul>
  </section>

  <!-- 3 banners -->
  <section class="banners" id="banners">
    <div class="banners__viewport">
      <div class="banners__track">
        <div class="banners__item"><a href="/collection/?handle=hidden-glow"><img src="https://theme.hstatic.net/200000408461/1001266442/14/home-four-banner-image-item-1.png?v=891" alt="home-four-banner-item-1"></a></div>
        <div class="banners__item"><a href="/collection/?handle=mong-doi-thuong"><img src="https://theme.hstatic.net/200000408461/1001266442/14/home-four-banner-image-item-2.png?v=891" alt="home-four-banner-item-2"></a></div>
        <div class="banners__item"><a href="/collection/?handle=summer-2026"><img src="https://theme.hstatic.net/200000408461/1001266442/14/home-four-banner-image-item-3.png?v=891" alt="home-four-banner-item-3"></a></div>
      </div>
      <ul class="banners__dots"></ul>
    </div>
  </section>

  <!-- New collection products -->
  <section class="products">
    <div class="section-head">
      <h2>Bộ sưu tập mới - Mộng đời thường</h2>
      <a class="btn-more" href="/collection/?handle=mong-doi-thuong">xem thêm</a>
    </div>
    <div class="products__body carousel" data-carousel data-show="4.1,3,2.2">
      <button type="button" class="carousel__arrow carousel__arrow--prev" aria-label="Previous"><svg><use href="#i-left"/></svg></button>
      <div class="carousel__viewport">
        <div class="carousel__track" id="product-track"></div>
      </div>
      <button type="button" class="carousel__arrow carousel__arrow--next" aria-label="Next"><svg><use href="#i-right"/></svg></button>
    </div>
  </section>

  <!-- MAUVE LADIES -->
  <section class="lookbook">
    <div class="section-head">
      <h2>MAUVE LADIES</h2>
      <a class="btn-more" href="/collection/?handle=mauve-ladies">xem thêm</a>
    </div>
    <div class="lookbook__body carousel" data-carousel data-show="5,3,2.2">
      <button type="button" class="carousel__arrow carousel__arrow--prev" aria-label="Previous"><svg><use href="#i-left"/></svg></button>
      <div class="carousel__viewport">
        <div class="carousel__track">
          <div class="lookbook__item"><a href="/product/?handle=uyen-ngu-dress"><img src="https://theme.hstatic.net/200000408461/1001266442/14/home-vendor-image-item-1.png?v=891" alt="home-vendor-item-1" loading="lazy"></a></div>
          <div class="lookbook__item"><a href="/product/?handle=signature-dress"><img src="https://theme.hstatic.net/200000408461/1001266442/14/home-vendor-image-item-2.png?v=891" alt="home-vendor-item-2" loading="lazy"></a></div>
          <div class="lookbook__item"><a href="/product/?handle=luc-dress"><img src="https://theme.hstatic.net/200000408461/1001266442/14/home-vendor-image-item-3.png?v=891" alt="home-vendor-item-3" loading="lazy"></a></div>
          <div class="lookbook__item"><a href="/collection/?handle=tops-and-bottoms"><img src="https://theme.hstatic.net/200000408461/1001266442/14/home-vendor-image-item-4.png?v=891" alt="home-vendor-item-4" loading="lazy"></a></div>
          <div class="lookbook__item"><a href="/product/?handle=thanh-hoa-dress"><img src="https://theme.hstatic.net/200000408461/1001266442/14/home-vendor-image-item-5.png?v=891" alt="home-vendor-item-5" loading="lazy"></a></div>
        </div>
      </div>
      <button type="button" class="carousel__arrow carousel__arrow--next" aria-label="Next"><svg><use href="#i-right"/></svg></button>
    </div>
  </section>
</main>

<script src="/js/store.js"></script>
<script src="/js/layout.js"></script>
<script src="/js/main.js"></script>
</body>
</html>
